# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running tests'
        required: false
        default: 'Manual test trigger'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: running integration test
      env:
        ZAI_API: ${{ secrets.ZAI_API }}
        GLM_MODEL: ${{ secrets.GLM_MODEL}}
        PINECONE_API: ${{ secrets.PINECONE_API}}
        PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE}}
        LOGGER_FILE: ${{ secrets.LOGGER_FILE}}
        MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
        MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
        HOST: ${{ secrets.HOST}}
        PORT: ${{ secrets.PORT}}
        ENVIRONMENT: ${{ secrets.ENVIRONMENT}}
      run: |
        #1. Start Gunicorn in the process and save process id
        cd backend/app
        gunicorn -c ./config/gunicorn_config.py app:app &
        GUNICORN_PID=$!

        #2. wait a few seconds for server to finish booting
        sleep 6

        #3. run request-based endpoint tests
        cd backend/tests
        python -m endpoint
        TEST_EXIT_CODE=$?

        #4. Clean up: kill the background gunicorn process
        kill $GUNICORN_PID
        
        #5. Fail the CI step if the tests failed      
        exit $TEST_EXIT_CODE
